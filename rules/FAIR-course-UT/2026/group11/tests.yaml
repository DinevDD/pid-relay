    - path: metadata/dataset
      accept: text/html,application/xhtml+xml
      note: browsers receive the same metadata target; there is no content negotiation
      status: 303
      location: https://raw.githubusercontent.com/wouter-deen/birdsoftheworld-dataset-fairification/main/metadata/dataset.ttl

    - path: data
      accept: text/csv
      note: Accept does not change the fairified data target
      status: 303
      location: https://raw.githubusercontent.com/wouter-deen/birdsoftheworld-dataset-fairification/main/data/birdsoftheworld-fairified.ttl

    - path: original.csv
      accept: text/turtle
      note: the original CSV target does not depend on Accept
      status: 303
      location: https://raw.githubusercontent.com/wouter-deen/birdsoftheworld-dataset-fairification/main/preprocessing/Birdsoftheworld.csv

    - path: original.csv/
      note: the original CSV rule does not allow a trailing slash
      status: 404

    - path: originalXcsv
      note: the dot in original.csv is literal
      status: 404

    - path: metadata/dataset/rights
      note: fragment nodes do not introduce extra HTTP paths
      status: 404

    - path: unknown
      status: 404
