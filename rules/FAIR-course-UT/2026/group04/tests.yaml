tests:
  # 1. Dataset (content negotiation)
  - pid: https://w3id.org/FAIR-course-UT/2026/group04/dataset/mimic-iv
    accept: text/turtle
    status: 303
    location: https://raw.githubusercontent.com/Kopaki-git/FAIRifaction-MIMIC_IV/main/metadata/mimic-iv-RDF_metadata.ttl

  - pid: https://w3id.org/FAIR-course-UT/2026/group04/dataset/mimic-iv
    accept: text/html,application/xhtml+xml
    status: 303
    location: https://github.com/Kopaki-git/FAIRifaction-MIMIC_IV

  # 2. RDF distribution
  - path: dataset/mimic-iv/rdf
    status: 303
    location: https://raw.githubusercontent.com/Kopaki-git/FAIRifaction-MIMIC_IV/main/rdf/mimic_icu_vitals_4h.ttl

  - path: dataset/mimic-iv/source
    status: 303
    location: https://physionet.org/content/mimic-iv-demo/get-zip/2.2/

  - path: dataset/mimic-iv/csv
    status: 303
    location: https://raw.githubusercontent.com/Kopaki-git/FAIRifaction-MIMIC_IV/main/data/derived/mimic_icu_vitals_4h.zip

  # 3. SHACL shapes
  - path: shapes/mimic-iv
    status: 303
    location: https://raw.githubusercontent.com/Kopaki-git/FAIRifaction-MIMIC_IV/main/metadata/mimic-iv-shacl_metadata.ttl

  # 4. Resources: hash IRIs such as data#patient-10023117 arrive as "data"
  - path: data
    accept: text/turtle
    status: 303
    location: https://raw.githubusercontent.com/Kopaki-git/FAIRifaction-MIMIC_IV/main/rdf/mimic_icu_vitals_4h.ttl

  - path: data
    accept: text/html,application/xhtml+xml
    status: 303
    location: https://github.com/Kopaki-git/FAIRifaction-MIMIC_IV/tree/main/rdf

  # 5. FHIR extensions
  - path: fhir/StructureDefinition/observation-mimic-warning
    status: 303
    location: https://github.com/Kopaki-git/FAIRifaction-MIMIC_IV/tree/main/docs

  - path: fhir/StructureDefinition/encounter-mimic-admission-type
    status: 303
    location: https://github.com/Kopaki-git/FAIRifaction-MIMIC_IV/tree/main/docs

  # 6. Landing page
  - path: ""
    note: root redirects to the repository
    status: 302
    location: https://github.com/Kopaki-git/FAIRifaction-MIMIC_IV

  # Negative tests
  - path: dataset/Not_Valid
    note: identifiers outside the pattern are not redirected
    status: 404

  - path: data/unknown-123
    note: unknown resource types are not redirected
    status: 404

  - path: data/patient-10023117
    note: resources use hash IRIs (data#...); slash forms are not identifiers
    status: 404
