{% extends "base.html" %}{% block title %}Log in{% endblock %}
{% block body %}
<section class="narrow card">
<h1>Log in</h1>
<form method="post">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label>Account <input name="username" autocomplete="username" required autofocus></label>
  <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
  <button class="primary">Log in</button>
</form>
<p class="muted small">Accounts are created by the service administrator.</p>
</section>
{% endblock %}
