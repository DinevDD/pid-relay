# pid-relay — Apache httpd configuration for the redirect service.
#
# The same file is used in production (official httpd:2.4 image) and by the
# test runner (python -m pidrelay test). Everything installation-specific
# comes from environment variables, which Apache expands at start-up:
#
#   PIDRELAY_MODULES     directory with mod_*.so files
#   PIDRELAY_RULES       absolute path of the rules/ directory
#   PIDRELAY_LISTEN      port (or addr:port) to listen on
#   PIDRELAY_PUBLIC_URL  public base, e.g. https://fair-testbed.eemcs.utwente.nl
#   PIDRELAY_RUNDIR      writable directory for pid file / logs
#   PIDRELAY_ERRORLOG    error log target (file path or /proc/self/fd/2)
#   PIDRELAY_ACCESSLOG   access log target (file path or /proc/self/fd/1)

ServerRoot "${PIDRELAY_RUNDIR}"
Listen ${PIDRELAY_LISTEN}
PidFile "${PIDRELAY_RUNDIR}/httpd.pid"

# MPM and core modules. Guards make the file work whether a module is
# compiled in statically or shipped as a shared object.
<IfModule !mpm_event_module>
  <IfModule !mpm_prefork_module>
    <IfModule !mpm_worker_module>
      LoadModule mpm_event_module ${PIDRELAY_MODULES}/mod_mpm_event.so
    </IfModule>
  </IfModule>
</IfModule>
<IfModule !authz_core_module>
  LoadModule authz_core_module ${PIDRELAY_MODULES}/mod_authz_core.so
</IfModule>
<IfModule !unixd_module>
  LoadModule unixd_module ${PIDRELAY_MODULES}/mod_unixd.so
</IfModule>
<IfModule !log_config_module>
  LoadModule log_config_module ${PIDRELAY_MODULES}/mod_log_config.so
</IfModule>
<IfModule !alias_module>
  LoadModule alias_module ${PIDRELAY_MODULES}/mod_alias.so
</IfModule>
<IfModule !rewrite_module>
  LoadModule rewrite_module ${PIDRELAY_MODULES}/mod_rewrite.so
</IfModule>
<IfModule !headers_module>
  LoadModule headers_module ${PIDRELAY_MODULES}/mod_headers.so
</IfModule>
<IfModule !mime_module>
  LoadModule mime_module ${PIDRELAY_MODULES}/mod_mime.so
</IfModule>
# Deliberately NOT loaded: mod_proxy (no [P] flag / open proxy), mod_cgi,
# mod_include, mod_autoindex, mod_dir. The relay only issues redirects.

# No file types are served; an empty map keeps mod_mime (needed for AddType) quiet.
TypesConfig /dev/null

<IfModule unixd_module>
  User daemon
  Group daemon
</IfModule>

# Redirects generated from relative substitutions use the public URL,
# not whatever host/scheme the internal proxy hop used.
ServerName ${PIDRELAY_PUBLIC_URL}
UseCanonicalName On
ServerTokens Prod
ServerSignature Off
TraceEnable Off

ErrorLog "${PIDRELAY_ERRORLOG}"
LogLevel warn
LogFormat "%h %t \"%r\" %>s \"%{Location}o\" \"%{Accept}i\" \"%{User-Agent}i\"" relay
CustomLog "${PIDRELAY_ACCESSLOG}" relay

# Nothing is served outside /pid/.
DocumentRoot "${PIDRELAY_RUNDIR}/empty"
<Directory />
  AllowOverride None
  Options None
  Require all denied
</Directory>

# /pid/<w3id-prefix>/... maps 1:1 onto rules/<w3id-prefix>/...
# A request for https://w3id.org/X/a/b is forwarded by the single W3ID rule
# to /pid/X/a/b and evaluated by rules/X/a/.htaccess exactly as W3ID would.
Alias "/pid/" "${PIDRELAY_RULES}/"

<Directory "${PIDRELAY_RULES}">
  # mod_rewrite in .htaccess requires FollowSymLinks. Symlinks are rejected
  # by the linter, so nothing outside the tree can be reached.
  Options FollowSymLinks

  # Contributors may only use redirect-related directives. Anything else in a
  # .htaccess makes that one directory answer 500, nothing more.
  AllowOverride Options=FollowSymLinks,SymLinksIfOwnerMatch,MultiViews
  AllowOverrideList RewriteEngine RewriteCond RewriteRule RewriteBase Redirect RedirectMatch RedirectPermanent RedirectTemp Header AddType

  Require all granted
</Directory>

# Bookkeeping files in the rules tree are never served.
<FilesMatch "^(OWNERS\.yaml|tests\.yaml|README\.md|\.ht.*)$">
  Require all denied
</FilesMatch>

# Without mod_dir/mod_autoindex, an unmatched path yields a plain 404/403.
ErrorDocument 404 "No redirect rule matches this identifier."
ErrorDocument 403 "No redirect rule matches this identifier."
