name: automerge

# Merges a pull request once "validate" passed, if it changes nothing outside
# rules/. This runs with the workflow definition of the base branch, so a
# pull request cannot alter it. Changes outside rules/ (code, CI, config)
# are never merged automatically and wait for an admin.

on:
  workflow_run:
    workflows: [validate]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    steps:
      - name: Merge if the change only touches rules/
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          pr=$(gh pr list -R "$REPO" --state open --base main --limit 200 \
                 --json number,headRefOid --jq ".[] | select(.headRefOid==\"$SHA\") | .number" | head -n1)
          if [ -z "$pr" ]; then echo "No open PR for $SHA (already merged or updated)"; exit 0; fi
          outside=$(gh pr view -R "$REPO" "$pr" --json files --jq '.files[].path' | grep -v '^rules/' || true)
          if [ -n "$outside" ]; then
            echo "PR #$pr touches files outside rules/, leaving it for an admin:"; echo "$outside"; exit 0
          fi
          gh pr merge -R "$REPO" "$pr" --squash --match-head-commit "$SHA" --delete-branch \
            || gh pr merge -R "$REPO" "$pr" --squash --match-head-commit "$SHA"
