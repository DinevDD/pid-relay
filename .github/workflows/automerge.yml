name: automerge

# Merges a pull request once "validate" passed, if it changes nothing outside
# rules/. Runs with the base branch's own workflow and code, so a pull request
# cannot alter it. Changes outside rules/ (code, CI, config) wait for an admin.
#
# Before merging, ownership is checked again against the CURRENT main, so two
# pull requests racing to claim the same folder cannot both get in. After
# merging, a claim (first pull request into an unclaimed group folder) is
# recorded by writing the author's GitHub login into that folder's OWNERS.yaml.

on:
  workflow_run:
    workflows: [validate]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: automerge
  cancel-in-progress: false

jobs:
  merge:
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Tools
        run: |
          python3 -c "import yaml" 2>/dev/null \
            || python3 -m pip install --quiet --break-system-packages pyyaml \
            || (sudo apt-get update -q && sudo apt-get install -y -q python3-yaml)
          python3 -c "import yaml; print('pyyaml', yaml.__version__)"

      - name: Find the pull request
        id: pr
        run: |
          set -euo pipefail
          pr=$(gh pr list -R "$REPO" --state open --base main --limit 200 \
                 --json number,headRefOid --jq ".[] | select(.headRefOid==\"$SHA\") | .number" | head -n1)
          if [ -z "$pr" ]; then echo "No open PR for $SHA (already merged or updated)"; exit 0; fi
          outside=$(gh pr view -R "$REPO" "$pr" --json files --jq '.files[].path' | grep -v '^rules/' || true)
          if [ -n "$outside" ]; then
            echo "PR #$pr touches files outside rules/, leaving it for an admin:"; echo "$outside"; exit 0
          fi
          echo "number=$pr" >> "$GITHUB_OUTPUT"
          echo "author=$(gh pr view -R "$REPO" "$pr" --json author --jq .author.login)" >> "$GITHUB_OUTPUT"

      - name: Re-check ownership against the current main
        if: steps.pr.outputs.number
        run: |
          set -euo pipefail
          git fetch --quiet origin "pull/${{ steps.pr.outputs.number }}/head:pr-head"
          test "$(git rev-parse pr-head)" = "$SHA"
          python3 -m pidrelay check-owners --base origin/main --head pr-head \
            --actor "${{ steps.pr.outputs.author }}"

      - name: Merge
        if: steps.pr.outputs.number
        run: |
          gh pr merge -R "$REPO" "${{ steps.pr.outputs.number }}" --squash --match-head-commit "$SHA" --delete-branch \
            || gh pr merge -R "$REPO" "${{ steps.pr.outputs.number }}" --squash --match-head-commit "$SHA"

      - name: Record a claim
        if: steps.pr.outputs.number
        run: |
          set -euo pipefail
          before=$(git rev-parse origin/main)
          git fetch --quiet origin main
          git checkout --quiet -B main origin/main
          merged=$(git rev-parse HEAD)
          python3 -m pidrelay record-claims --base "$before" --head "$merged" \
            --actor "${{ steps.pr.outputs.author }}"
          if [ -n "$(git status --porcelain rules)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add rules
            git commit --quiet -m "Record owner of folder claimed in #${{ steps.pr.outputs.number }}"
            git push --quiet origin main
          fi
