name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    # Same Apache build as production.
    container: httpd:2.4
    steps:
      - name: Install tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git python3 python3-yaml ca-certificates

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Toolkit self-tests
        run: python3 -m unittest discover -s tests -v

      - name: Lint and test all rules on Apache httpd
        run: python3 -m pidrelay test

      - name: Check that the author owns what the change touches
        if: github.event_name == 'pull_request'
        run: >
          python3 -m pidrelay check-owners
          --base "${{ github.event.pull_request.base.sha }}"
          --head "${{ github.event.pull_request.head.sha }}"
          --actor "${{ github.event.pull_request.user.login }}"
